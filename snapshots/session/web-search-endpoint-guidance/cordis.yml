# Live-recording patch for a deterministic failed DeepSeek search request.
- insert:
    - id: web-search-error-fixture
      name: './web-search-error-fixture.mjs'

- id: web-deepseek-api
  name: '@deepseek-ai/dsh-web-deepseek-api'
  config:
    searchApiKeyEnv: DSH_SNAPSHOT_SEARCH_KEY
    # The fixture maps this recorded authority to its OS-assigned listener.
    searchBaseURL: http://127.0.0.1:43118/api/v1/tools

# The scenario asserts on a DeepSeek search request, so it names the provider
# instead of inheriting the shipped default. It silently depended on that
# default being `deepseek-official` and broke the day the bundle pinned
# `duckduckgo` — a scenario that breaks when an unrelated default moves is a
# scenario that will break again.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official
