# Web search and fetch for a deployment without a DeepSeek credential: the two
# keyed search providers and the keyless DuckDuckGo default, plus the fetch
# range a transparent-proxy host needs. Listed after `@deepseek-ai/dsh-base`,
# whose `web` row this repoints and whose `web-fetch-http` row it extends.
- id: web
  config:
    # Keyless by default: the DeepSeek search route needs a credential that a
    # self-hosted deployment usually does not have, and the selector pins
    # whatever is named here — a configured id has no fallback. Point this at
    # `deepseek-official`, `exa`, or `perplexity` once a key is configured.
    searchProvider: duckduckgo
    fetchProvider: http

- insert:
    # Mounted but not selected: a deployment with no credential can switch to it
    # by naming `searchProvider: duckduckgo`, and a credentialed one keeps the
    # DeepSeek route above.
    - id: web-search-duckduckgo
      name: '@deepseek-ai/dsh-web-search-duckduckgo'

    # Keyed providers. Each reads its own credential reference, which the Web
    # Search settings page writes for that provider's namespace; neither is
    # selected until `searchProvider` above names it.
    - id: web-search-brave
      name: '@deepseek-ai/dsh-web-search-brave'

    - id: web-search-tavily
      name: '@deepseek-ai/dsh-web-search-tavily'

- id: web-fetch-http
  config:
    # Only for a host whose system DNS answers every domain with a synthetic
    # fake-IP address (a transparent proxy client in `fake-ip`/TUN mode),
    # which this package would otherwise refuse to connect to as non-public.
    # `198.18.0.0/15` is IANA benchmarking space and hosts no legitimate
    # service of its own.
    #
    # This does NOT mean 10/8, 172.16/12, 192.168/16, 100.64/10, loopback,
    # link-local and unique-local stay independently blocked for a domain
    # this flow actually fetches: this package only ever validates the
    # synthetic address it was handed, never the domain's real destination.
    # For a domain the transparent client routes "direct" (its own real DNS
    # lookup, not through a remote relay), nothing here sees that real
    # address, and a DNS-rebinding domain pointed at a private IP would
    # reach it exactly as it would with no fetch guard at all — the guard's
    # safety for that request now rests entirely on the external transparent
    # client's own routing, which this package cannot see or validate.
    # Preferred remedy: switch the transparent client to `redir-host`/`real-ip`
    # mode and delete this list, so DNS returns real addresses and this
    # package's own guard governs every destination again.
    trustedProxyAddressRanges:
      - 198.18.0.0/15
