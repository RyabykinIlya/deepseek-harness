# Web search and fetch for a deployment without a DeepSeek credential: the two
# keyed search providers and the keyless DuckDuckGo default. Listed after
# `@deepseek-ai/dsh-base`, whose `web` row this repoints and whose
# `web-fetch-http` row it extends.
- id: web
  config:
    # Keyless by default: the DeepSeek search route needs a credential that a
    # self-hosted deployment usually does not have, and the selector pins
    # whatever is named here — a configured id has no fallback. Point this at
    # `deepseek-official`, `exa`, or `perplexity` once a key is configured.
    searchProvider: duckduckgo
    fetchProvider: http

- insert:
    # Mounted but not selected: a deployment with no credential can switch to it
    # by naming `searchProvider: duckduckgo`, and a credentialed one keeps the
    # DeepSeek route above.
    - id: web-search-duckduckgo
      name: '@deepseek-ai/dsh-web-search-duckduckgo'

    # Keyed providers. Each reads its own credential reference, which the Web
    # Search settings page writes for that provider's namespace; neither is
    # selected until `searchProvider` above names it.
    - id: web-search-brave
      name: '@deepseek-ai/dsh-web-search-brave'

    - id: web-search-tavily
      name: '@deepseek-ai/dsh-web-search-tavily'

# No `web-fetch-http` override: since dsh-v0.2.2-alpha.2 the HTTP fetch
# provider does not reject non-public destinations, so fetches behind a
# transparent proxy in `fake-ip`/TUN mode work with no configuration. The
# former `trustedProxyAddressRanges` override (198.18.0.0/15) was removed
# with that provider's address guard. Network access restriction is now the
# deployment's own concern (proxy policy, firewall), not a fetch-config key.
